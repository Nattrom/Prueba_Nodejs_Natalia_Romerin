services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-riwimedicare_plus}
      DB_USER: ${POSTGRES_USER:-riwi_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-riwi_password}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SWAGGER_TITLE: RiwiMediCare Plus API
      SWAGGER_VERSION: 1.0.0
      SWAGGER_DESCRIPTION: Backend API for medicine supply management
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - riwimedicare-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riwimedicare_plus}
      POSTGRES_USER: ${POSTGRES_USER:-riwi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riwi_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - riwimedicare-network

volumes:
  postgres_data:

networks:
  riwimedicare-network:
    driver: bridge